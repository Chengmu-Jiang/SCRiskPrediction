# @package _global_

defaults:
  - data: scnews_structured
  - model: structured_risk
  - paths: default
  - hydra: default
  - _self_
  - experiment: null

task_name: "structured_train"
tags: ["structured-risk"]

output_dir: "${paths.root_dir}/outputs/structured_pipeline"
tensorboard_log_dir: "C:/tensorboard_logs/SCRiskPrediction/structured_pipeline"
no_tensorboard: false

save_representations: false
run_graph_propagation: false
train_supervised: true
dry_run: false
max_rows: null
max_label_rows: null

epochs: 50
lr: 1e-3
weight_decay: 1e-4
grad_clip_norm: 5.0
checkpoint_metric: "val_supervised"
repeat_seeds: ""

train_ratio: 0.70
val_ratio: 0.15
split_strategy: "time-series"
final_test_ratio: 0.15
tscv_n_splits: 5
tscv_test_size: null
tscv_gap: 0

early_stopping_patience: 0
early_stopping_min_delta: 1e-4
log_every: 5
