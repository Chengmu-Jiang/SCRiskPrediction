# @package _global_

output_dir: "${paths.root_dir}/outputs/structured_baselines/dcrnn_single"
tensorboard_log_dir: "C:/tensorboard_logs/SCRiskPrediction/structured_baselines/dcrnn_single"

llm_forecast_csv: "${paths.root_dir}/outputs/llm_event_tone_experiments_expanded/forecast_baseline__optimizer_legacy/prompt_optimization/final/forecast_events.csv"
llm_embedding_npz: "${paths.root_dir}/outputs/llm_event_tone_experiments_expanded/forecast_baseline__optimizer_legacy/prompt_optimization/final/forecast_event_embeddings.npz"

seed: 42
repeat_seeds: "42,42,42,42,42"
epochs: 300
lr: 5e-3
weight_decay: 1e-4
grad_clip_norm: 5.0
checkpoint_metric: "val_supervised"
early_stopping_patience: 10
early_stopping_min_delta: 1e-4
tscv_n_splits: 5
log_every: 10

projection_dim: 64
representation_dim: 64
graph_state_dim: 64
sent_hidden_sizes: "128"
eval_hidden_sizes: "64"

dropout: 0.1
graph_dropout: 0.1
eval_dropout: 0.1

smooth_weight: 0.0
propagation_model: "dcrnn"
dcrnn_diffusion_steps: 2
dcrnn_bidirectional: false

align_weight: 0.75
align_temperature: 0.03
align_dim: 64
align_hidden_sizes: ""
align_dropout: 0.1
