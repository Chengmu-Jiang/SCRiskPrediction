# Single-file configuration for src/llm_event_tone.py.
# Run with:
#   python .\src\llm_event_tone.py --config .\configs\llm_event_tone.yaml
#
# Do not put API keys here. Set the environment variable named by api_key_env.

stage: optimize-prompt

news_csv: data/News/DailyTop_News/daily_top_news.csv
nodes_csv: data/IndustryChain/Filtered_Node_List_by_IGPC.csv
output_dir: outputs/llm_event_tone_experiments/forecast_baseline_one_shot_v1__optimizer_anti_overfit_v1

topic_col: Topic
date_col: Date
target_col: ArticleScore
title_col: Article_Title
text_col: Article_Text
topic_hs_map:
  Automaker: 8703
  Nexperia: 3818

win: 5
split_strategy: time-series
train_ratio: 0.70
val_ratio: 0.15
final_test_ratio: 0.15
tscv_n_splits: 5
tscv_test_size: null
tscv_gap: 0

llm_mode: api
api_key_env: LLM_API_KEY
api_base: https://api.deepseek.com
api_model: deepseek-v4-flash
local_model_path: C:/Users/Administrator/.cache/modelscope/hub/models/Qwen/Qwen3-8B
temperature: 0.5
top_p: 0.9
thinking: auto
reasoning_effort: none
compress_max_tokens: 4096
forecast_max_tokens: 4096
request_sleep: 0.0
llm_empty_retries: 3
llm_empty_retry_sleep: 2.0
force_llm: false

forecast_prompt_guidance: ""
forecast_prompt_path: configs/llm_tone/prompts/forecast/baseline_one_shot_v1.yaml
optimizer_prompt_path: configs/llm_tone/prompts/optimizer/anti_overfit_v1.yaml
prompt_optimization_rounds: 3
prompt_loss_top_fraction: 0.20
prompt_agent_max_tokens: 4096
prompt_feedback_text_chars: 900
prompt_feedback_history_chars: 600
prompt_guidance_max_bullets: 12

encoder_model: C:/Users/Administrator/.cache/modelscope/hub/models/BAAI/bge-base-en-v1.5
encoder_device: cuda
encoder_max_length: 512
embedding_batch_size: 16
pooling: cls

train_device: cuda
hidden_sizes: "256,64"
dropout: 0.2
batch_size: 16
epochs: 300
lr: 1e-3
weight_decay: 1e-4
patience: 30
min_delta: 1e-5
seed: 42

ridge_alphas: "0.01,0.1,1,10,100,1000"
huber_alpha: 1e-4
huber_epsilon: 1.35
huber_max_iter: 5000

fixed_scorer_include_final: false
fixed_mlp_hidden_sizes: "32"
fixed_mlp_dropout: 0.2
fixed_mlp_batch_size: 16
fixed_mlp_epochs: 500
fixed_mlp_lr: 1e-3
fixed_mlp_weight_decay: 1e-4
fixed_mlp_patience: 50
fixed_mlp_min_delta: 1e-5
